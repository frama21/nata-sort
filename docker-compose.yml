# Single-container deployment — unprivileged nginx serving the static build.
# All nginx config (security headers, caching, SPA fallback) lives in the Dockerfile.
#
#   docker compose up -d --build   # build & run → http://localhost:8080
#   docker compose down            # stop
#
# For public HTTPS, terminate TLS at your platform's edge (Cloudflare, a load
# balancer, Caddy/Traefik you already run) and forward to this container.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nata-sort:latest
    container_name: nata-sort
    restart: unless-stopped
    ports:
      # host:container — open http://localhost:8080
      - "8080:8080"

    # ---- Hardening ----
    read_only: true # immutable root filesystem
    tmpfs:
      - /tmp:size=16m,mode=1777 # nginx pid + temp files live here
    security_opt:
      - no-new-privileges:true # block setuid privilege escalation
    cap_drop:
      - ALL # nginx on port 8080 needs no Linux capabilities

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
        reservations:
          memory: 32M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
