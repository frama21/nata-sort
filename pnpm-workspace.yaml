allowBuilds:
  exifreader: true
  msw: true

# Force patched versions of transitive dev/build-only deps (vite dev server and
# build tooling). None of them ship in the production image, which serves only
# the static build via server/. Keeps `pnpm audit` clean.
overrides:
  "@babel/core@<7.29.6": ">=7.29.6 <8"
  "vite@<8.0.16": ">=8.0.16"
  "brace-expansion@>=5.0.0 <5.0.6": ">=5.0.6"
